<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Cancionero Amimichis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>

<!-- Pantalla 1: índice con buscador y lista alfabética -->
<section id="home">
  <!-- Portada: solo en la primera vista; el buscador queda fijo al hacer scroll -->
  <div class="hero">
    <h1>CANCIONERO</h1>
    <p>AMIMICHIS &hearts;</p>
  </div>
  <header class="bar">
    <input id="q" type="search" placeholder="Buscar canción o artista…" autocomplete="off" enterkeyhint="search">
    <button id="theme-home" class="btn icon" aria-label="Modo oscuro">◐</button>
  </header>
  <div id="tabs"><button data-m="artists">Artistas</button><button data-m="az">Todas A–Z</button></div>
  <div id="crumb" hidden><button id="up" class="btn">← Artistas</button><b id="crumb-t"></b></div>
  <p id="count"></p>
  <ul id="list"></ul>
  <nav id="letters" aria-label="Saltar a letra"></nav>
</section>

<!-- Pantalla 2: canción -->
<section id="song" hidden>
  <header class="bar top">
    <div><b id="s-title"></b><small id="s-artist"></small></div>
  </header>
  <div id="pages"></div>
  <footer class="controls">
    <div class="row">
      <button id="back" class="btn">☰ Índice</button>
      <button id="prev" class="btn icon" aria-label="Canción anterior">◀</button>
      <button id="play" class="btn primary" aria-label="Autoscroll">▶</button>
      <button id="next" class="btn icon" aria-label="Canción siguiente">▶︎</button>
    </div>
    <div class="row">
      <input id="speed" type="range" min="5" max="120" step="1" aria-label="Velocidad">
      <button id="zout" class="btn icon" aria-label="Alejar">−</button>
      <button id="zin" class="btn icon" aria-label="Acercar">+</button>
      <button id="theme" class="btn icon" aria-label="Modo oscuro">◐</button>
    </div>
  </footer>
</section>

<div id="toast" hidden></div>
<script src="vendor/pdf.min.js"></script>
<script src="app.js?v=10"></script>
</body>
</html>
